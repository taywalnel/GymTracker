<div class="app-shell" [class.app-shell--no-tabs]="!showTabBar()">
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  @if (showUpdatePrompt()) {
    <div class="update-banner" role="status">
      <span>A new version is available</span>
      <button
        type="button"
        class="update-banner__action"
        (click)="reloadForUpdate()"
      >
        Reload
      </button>
    </div>
  }

  @if (isOffline()) {
    <p class="offline-banner" role="status">
      Offline — changes will sync when you reconnect
    </p>
  }

  @if (showTabBar()) {
    <nav class="tab-bar">
      <a
        class="tab-bar__item"
        routerLink="/"
        [class.is-active]="isTodayRoute()"
        (click)="onTodayTabClick($event)"
      >
        <span class="tab-bar__label">Workout</span>
      </a>
      <a
        class="tab-bar__item"
        routerLink="/program"
        routerLinkActive="is-active"
      >
        <span class="tab-bar__label">Program</span>
      </a>
      <a
        class="tab-bar__item"
        routerLink="/body-weight"
        routerLinkActive="is-active"
      >
        <span class="tab-bar__label">Weight</span>
      </a>
      <a
        class="tab-bar__item"
        routerLink="/history"
        routerLinkActive="is-active"
      >
        <span class="tab-bar__label">History</span>
      </a>
      <a
        class="tab-bar__item"
        routerLink="/account"
        routerLinkActive="is-active"
      >
        <span class="tab-bar__label">Account</span>
      </a>
    </nav>
  }
</div>
