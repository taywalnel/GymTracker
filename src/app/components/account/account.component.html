<div class="account-page">
  <app-page-header title="Account" />

  @if (auth.currentUser(); as user) {
    <section class="account-section">
      <div class="account-row">
        <span class="account-row__label">Signed in as</span>
        <span class="account-row__value">{{
          user.displayName || user.email
        }}</span>
      </div>
    </section>

    <section class="account-section">
      <app-button variant="secondary" (click)="auth.logout()"
        >Sign out</app-button
      >
    </section>

    <section class="account-section">
      <h3 class="account-section__heading">Units</h3>
      <div class="account-row">
        <span class="account-row__label">Weight unit</span>
        <app-unit-toggle />
      </div>
    </section>
  }
</div>
