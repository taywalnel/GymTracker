<div class="account-page">
  <app-page-header
    title="Account"
    [tabs]="['Account', 'Settings']"
    (selectedTab)="selectTab($event)"
  />

  @if (activeTab === "Account" && auth.currentUser(); as user) {
    <section class="account-section">
      <div class="card account-card">
        <div class="account-row">
          <span class="account-row__label">Signed in as</span>
          <span class="account-row__value">{{
            user.displayName || user.email
          }}</span>
        </div>
      </div>
      <app-button
        variant="secondary"
        [danger]="true"
        [fullWidth]="true"
        (click)="auth.logout()"
      >
        Sign out
      </app-button>
    </section>
  }

  @if (activeTab === "Settings") {
    <section class="account-section" aria-labelledby="units-heading">
      <h3 id="units-heading" class="section-label">Units</h3>
      <div class="card account-card">
        <div class="account-row">
          <span class="account-row__label">Weight unit</span>
          <app-unit-toggle />
        </div>
      </div>
    </section>
  }
</div>
