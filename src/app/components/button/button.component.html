<button
  [type]="type"
  [disabled]="disabled || loading || null"
  class="app-btn"
  [class.app-btn--primary]="variant === 'primary'"
  [class.app-btn--secondary]="variant === 'secondary'"
  [class.app-btn--ghost]="variant === 'ghost'"
  [class.app-btn--icon]="variant === 'icon'"
  [class.app-btn--danger]="danger"
  [class.app-btn--selected]="selected"
  [class.app-btn--sm]="size === 'sm'"
  [class.app-btn--lg]="size === 'lg'"
  [class.app-btn--full]="fullWidth"
  [class.app-btn--stretch]="stretch"
  [class.app-btn--loading]="loading"
  [attr.aria-label]="ariaLabel"
  [attr.aria-busy]="loading || null"
>
  @if (iconSvg) {
    <span class="app-btn__icon" [innerHTML]="iconSvg" aria-hidden="true"></span>
  }
  @if (variant !== "icon") {
    <span class="app-btn__label"><ng-content></ng-content></span>
  }
  @if (loading) {
    <span class="app-btn__spinner" aria-hidden="true"></span>
  }
</button>
