<button
  [type]="type"
  [disabled]="disabled || null"
  class="app-btn"
  [class.app-btn--primary]="variant === 'primary'"
  [class.app-btn--secondary]="variant === 'secondary'"
  [class.app-btn--ghost]="variant === 'ghost'"
  [class.app-btn--icon]="variant === 'icon'"
  [class.app-btn--complete]="variant === 'complete'"
  [class.app-btn--danger]="variant === 'danger' || danger"
  [class.app-btn--selected]="selected"
  [attr.aria-label]="ariaLabel"
  [class.app-btn--sm]="size === 'sm'"
  [class.app-btn--full]="fullWidth"
  [style.height]="height"
>
  @if (variant === "icon") {
    @if (iconSvg) {
      <span class="icon-container" [innerHTML]="iconSvg"></span>
    }
  } @else {
    <ng-content></ng-content>
  }
</button>
