<div class="calendar">
  @if (!hideNav) {
    <div class="calendar__nav">
      <app-button
        variant="icon"
        iconName="chevron-left"
        (click)="prevMonth()"
        aria-label="Previous month"
      >
        ‹
      </app-button>
      <span class="calendar__month-label">{{ calendarMonthLabel }}</span>
      <app-button
        variant="icon"
        iconName="chevron-right"
        (click)="nextMonth()"
        [disabled]="isCurrentMonth"
        aria-label="Next month"
      />
    </div>
  }

  <div class="calendar__grid">
    <span class="calendar__dow">M</span>
    <span class="calendar__dow">T</span>
    <span class="calendar__dow">W</span>
    <span class="calendar__dow">T</span>
    <span class="calendar__dow">F</span>
    <span class="calendar__dow">S</span>
    <span class="calendar__dow">S</span>

    @for (day of calendarDays; track day.dateStr) {
      <div
        class="calendar__cell"
        [class.out-of-month]="!day.inMonth"
        [class.has-workout]="day.hasWorkout"
        [class.is-today]="day.isToday"
      >
        <span class="calendar__day-num">{{ day.date.getDate() }}</span>
        @if (day.hasWorkout) {
          <span class="calendar__dot"></span>
        }
      </div>
    }
  </div>
</div>
