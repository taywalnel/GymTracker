<div class="modal-backdrop" (click)="cancel()">
  <section
    class="modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    [attr.aria-describedby]="messageId"
    (click)="$event.stopPropagation()"
  >
    <h2 [id]="titleId">{{ title }}</h2>
    <p class="modal__message" [id]="messageId">{{ message }}</p>

    <div class="modal__actions">
      @if (secondaryLabel) {
        <div>
          <app-button
            variant="primary"
            [fullWidth]="true"
            (click)="triggerSecondary()"
          >
            {{ secondaryLabel }}
          </app-button>
        </div>
      }
      @if (!secondaryLabel) {
        <div>
          <app-button variant="secondary" [fullWidth]="true" (click)="cancel()">
            {{ cancelLabel }}
          </app-button>
        </div>
      }
      <div>
        <app-button
          variant="primary"
          [fullWidth]="true"
          [danger]="danger"
          (click)="confirm()"
        >
          {{ confirmLabel }}
        </app-button>
      </div>
      @if (secondaryLabel) {
        <div class="modal-actions__cancel">
          <app-button variant="secondary" [fullWidth]="true" (click)="cancel()">
            {{ cancelLabel }}
          </app-button>
        </div>
      }
    </div>
  </section>
</div>
