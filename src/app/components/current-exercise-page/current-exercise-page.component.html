@if (isLoading) {
  <div class="loading-state" role="status" aria-label="Loading exercise">
    <app-loading-spinner />
  </div>
} @else if (state && exercise) {
  <app-exercise-card
    [exercise]="exercise"
    [isCurrent]="true"
    [progressionSuggestionAlreadyShown]="progressionSuggestionAlreadyShown"
    [savedSets]="savedSets"
    (setsChanged)="onSetsChanged($event)"
    (markComplete)="onMarkComplete()"
    (back)="goToWorkout()"
    (adjustRoutineRequested)="adjustRoutine()"
    (progressionSuggestionShown)="onProgressionSuggestionShown()"
  />
}
