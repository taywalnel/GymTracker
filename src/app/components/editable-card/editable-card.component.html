<app-card [title]="title" [description]="description"></app-card>
<app-button
  variant="icon"
  [height]="'100%'"
  ariaLabel="Edit {{ title }}"
  (click)="edit.emit()"
>
  <span [innerHTML]="editSvg"></span>
</app-button>
<app-button
  variant="icon"
  [height]="'100%'"
  [danger]="true"
  ariaLabel="Delete {{ title }}"
  (click)="delete.emit()"
>
  <span [innerHTML]="deleteSvg"></span>
</app-button>
