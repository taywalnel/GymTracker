<app-card
  [title]="title"
  [description]="description"
  [showChevron]="showChevron"
  (click)="cardClick.emit()"
></app-card>
@if (showEdit || showDelete) {
  <div class="buttons-wrapper">
    @if (showEdit) {
      <app-button
        variant="icon"
        iconName="edit"
        [stretch]="true"
        ariaLabel="Edit {{ title }}"
        (click)="edit.emit()"
      />
    }
    @if (showDelete) {
      <app-button
        variant="icon"
        iconName="delete"
        [stretch]="true"
        [danger]="true"
        ariaLabel="Delete {{ title }}"
        (click)="delete.emit()"
      />
    }
  </div>
}
