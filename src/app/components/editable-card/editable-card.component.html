<app-card [title]="title" [description]="description"></app-card>
<div class="buttons-wrapper">
  @if (showActive) {
    <label class="active-control">
      <span class="active-control__label">Active</span>
      <input
        type="checkbox"
        [checked]="active"
        (change)="onActiveChange($event)"
        [attr.aria-label]="(active ? 'Deactivate ' : 'Activate ') + title"
      />
    </label>
  }
  <app-button
    variant="icon"
    iconName="edit"
    [height]="'100%'"
    ariaLabel="Edit {{ title }}"
    (click)="edit.emit()"
  />
  <app-button
    variant="icon"
    iconName="delete"
    [height]="'100%'"
    [danger]="true"
    ariaLabel="Delete {{ title }}"
    (click)="delete.emit()"
  />
</div>
