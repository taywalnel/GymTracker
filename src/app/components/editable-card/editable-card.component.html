<app-card [title]="title" [description]="description"></app-card>
<div class="buttons-wrapper">
  <app-button
    variant="icon"
    iconName="edit"
    [height]="'100%'"
    ariaLabel="Edit {{ title }}"
    (click)="edit.emit()"
  />
  <app-button
    variant="icon"
    iconName="delete"
    [height]="'100%'"
    [danger]="true"
    ariaLabel="Delete {{ title }}"
    (click)="delete.emit()"
  />
</div>
