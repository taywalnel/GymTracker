<div class="top-section">
  <app-page-header
    [title]="exercise.name"
    [showBack]="true"
    (back)="back.emit()"
  />
  <app-weight-and-reps
    [weight]="currentWeightKg"
    [sets]="currentSetReps"
    [activeIndex]="activeSetIndex"
  ></app-weight-and-reps>
</div>

<div>
  <p class="stepper__label">Target</p>
  <div class="exercise-card__target-summary">
    <div class="stepper-container">
      <p class="stepper__label">Reps</p>
      <span class="exercise-card__target-value">{{ exercise.targetReps }}</span>
    </div>
    <div class="stepper-container">
      <p class="stepper__label">Weight ({{ units.unitLabel() }})</p>
      <span class="exercise-card__target-value"
        >{{ formatWeight(exercise.targetWeightKg) }}
      </span>
    </div>
  </div>
</div>

<div class="set-row">
  <div>
    <p class="stepper__label">Completed</p>
    <div class="row">
      <div class="row-item">
        <app-stepper
          [value]="
            setTouched[activeSetIndex]
              ? workingSets[activeSetIndex].reps
              : exercise.targetReps
          "
          unit="reps"
          [ariaLabel]="'reps for set ' + workingSets[activeSetIndex].setNumber"
          (valueChange)="stepReps(activeSetIndex, $event)"
        ></app-stepper>
      </div>
      <div class="row-item">
        <app-button
          variant="primary"
          [fullWidth]="true"
          (click)="completeCurrentSet()"
          [height]="'100%'"
        >
          Complete set
        </app-button>
      </div>
    </div>
  </div>
</div>

@if (restTimer.secondsLeft !== null) {
  <button
    type="button"
    class="rest-timer"
    [class.rest-timer--collapsed]="restTimerCollapsed"
    (click)="toggleRestTimer()"
    aria-label="Toggle rest timer"
    aria-live="polite"
  >
    <p class="rest-timer__label">Rest</p>
    <span class="rest-timer__time">{{ restTimer.secondsLeft }}</span>
    <span class="rest-timer__unit">seconds</span>
  </button>
}
