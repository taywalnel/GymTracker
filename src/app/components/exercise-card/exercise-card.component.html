<div class="top-section">
  <app-page-header
    [title]="exercise.name"
    [showBack]="true"
    (back)="back.emit()"
  />
  <app-weight-and-reps
    [weight]="currentWeightKg"
    [sets]="currentSetReps"
    [activeIndex]="activeSetIndex"
  ></app-weight-and-reps>
</div>

<div>
  <p class="stepper__label">Target</p>
  <div class="exercise-card__target-summary">
    <div class="stepper-container">
      <p class="stepper__label">Reps</p>
      <span class="exercise-card__target-value">{{ exercise.targetReps }}</span>
    </div>
    <div class="stepper-container">
      <p class="stepper__label">Weight ({{ units.unitLabel() }})</p>
      <span class="exercise-card__target-value"
        >{{ formatWeight(exercise.targetWeightKg) }}
      </span>
    </div>
  </div>
</div>

<div class="set-row">
  <div>
    <p class="stepper__label">Completed</p>
    <div class="stepper">
      <button
        type="button"
        class="stepper__btn stepper__btn--minus"
        (click)="stepReps(activeSetIndex, -1)"
        [attr.aria-label]="
          'Decrease reps for set ' + workingSets[activeSetIndex].setNumber
        "
      >
        −
      </button>
      <div class="stepper__value">
        <span class="stepper__number">{{
          setTouched[activeSetIndex]
            ? workingSets[activeSetIndex].reps
            : exercise.targetReps
        }}</span>
        <span class="stepper__unit">reps</span>
      </div>
      <button
        type="button"
        class="stepper__btn stepper__btn--plus"
        (click)="stepReps(activeSetIndex, 1)"
        [attr.aria-label]="
          'Increase reps for set ' + workingSets[activeSetIndex].setNumber
        "
      >
        +
      </button>
    </div>
  </div>
  <div class="buttons-row">
    <app-button
      variant="primary"
      [fullWidth]="true"
      (click)="completeCurrentSet()"
      [height]="'40px'"
    >
      Complete set
    </app-button>
  </div>
</div>

@if (restTimer.secondsLeft !== null) {
  <button
    type="button"
    class="rest-timer"
    [class.rest-timer--collapsed]="restTimerCollapsed"
    (click)="toggleRestTimer()"
    aria-label="Toggle rest timer"
    aria-live="polite"
  >
    <p class="rest-timer__label">Rest</p>
    <span class="rest-timer__time">{{ restTimer.secondsLeft }}</span>
    <span class="rest-timer__unit">seconds</span>
  </button>
}
