<app-page-header title="Exercise History" [showBack]="true" (back)="goBack()" />

@if (isLoading) {
  <div
    class="loading-state"
    role="status"
    aria-label="Loading exercise history"
  >
    <app-loading-spinner />
  </div>
} @else if (historyEntries.length === 0) {
  <p class="state-message">No completed sets yet.</p>
} @else {
  <div class="history-list">
    @for (entry of historyEntries; track entry.date) {
      @if (entry.log.completedSets.length > 0) {
        <div class="history-entry">
          <span class="date-header">{{ formatDate(entry.date) }}</span>
          <div class="set-list">
            <app-weight-and-reps
              [weight]="entry.log.completedSets[0].weightKg"
              [sets]="toWeightAndRepsSets(entry.log)"
            />
          </div>
        </div>
      }
    }
  </div>
}
