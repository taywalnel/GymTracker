<app-page-header
  [title]="exerciseName"
  [showBack]="true"
  [tabs]="historyTabs"
  (back)="goBack()"
  (selectedTab)="activeTab = $event"
/>

@if (isLoading) {
  <div
    class="loading-state"
    role="status"
    aria-label="Loading exercise history"
  >
    <app-loading-spinner />
  </div>
} @else if (completedEntries.length === 0) {
  <p class="state-message">No completed sets yet.</p>
} @else {
  <main class="exercise-detail">
    @if (activeTab === "Progression") {
      <app-exercise-progression [entries]="completedEntries" />
    } @else {
      <section class="history-section" aria-labelledby="history-title">
        <div class="history-list">
          @for (entry of historyDisplayEntries; track entry.date) {
            <div class="history-entry">
              <span class="date-header">{{ formatDate(entry.date) }}</span>
              <div class="set-list">
                <app-weight-and-reps
                  [weight]="entry.log.completedSets[0].weightKg"
                  [sets]="toWeightAndRepsSets(entry.log)"
                  [size]="'small'"
                />
              </div>
            </div>
          }
        </div>
      </section>
    }
  </main>
}
