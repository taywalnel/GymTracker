<div class="login-page">
  <div class="login-card">
    <h1 class="login-card__title">Gym Tracker</h1>
    <p class="login-card__subtitle">Sign in to sync your workouts</p>
    <form
      class="login-card__form"
      [formGroup]="credentialsForm"
      (ngSubmit)="login()"
    >
      <label class="form-group login-card__field" for="email">
        <span class="form-label">Email</span>
        <input
          id="email"
          type="email"
          class="form-input"
          autocomplete="email"
          formControlName="email"
          [attr.aria-invalid]="
            credentialsForm.controls.email.touched &&
            credentialsForm.controls.email.invalid
          "
        />
        @if (
          credentialsForm.controls.email.touched &&
          credentialsForm.controls.email.invalid
        ) {
          <span class="form-error">Enter a valid email address.</span>
        }
      </label>

      <label class="form-group login-card__field" for="password">
        <span class="form-label">Password</span>
        <input
          id="password"
          type="password"
          class="form-input"
          autocomplete="current-password"
          formControlName="password"
          [attr.aria-invalid]="
            credentialsForm.controls.password.touched &&
            credentialsForm.controls.password.invalid
          "
        />
        @if (
          credentialsForm.controls.password.touched &&
          credentialsForm.controls.password.invalid
        ) {
          <span class="form-error"
            >Password must be at least 6 characters.</span
          >
        }
      </label>

      <app-button
        variant="primary"
        size="lg"
        type="submit"
        [fullWidth]="true"
        [loading]="auth.isLoading()"
      >
        Log in
      </app-button>
      <app-button
        variant="secondary"
        size="lg"
        [fullWidth]="true"
        [disabled]="auth.isLoading()"
        (click)="register()"
      >
        Create account
      </app-button>
    </form>

    <app-button
      variant="ghost"
      size="sm"
      [disabled]="auth.isLoading()"
      (click)="resetPassword()"
    >
      Forgot password?
    </app-button>
    @if (auth.authError()) {
      <p class="login-card__error" role="alert">{{ auth.authError() }}</p>
    }
  </div>
</div>
