@if (backLink || showBack || title || showRightAction) {
  <div class="page-header__heading">
    @if (backLink) {
      <button type="button" [routerLink]="backLink" class="back-link">
        {{ backLabel }}
      </button>
    } @else if (showBack) {
      <button type="button" class="back-link" (click)="back.emit()">
        {{ backLabel }}
      </button>
    }

    @if (title) {
      <h2 class="page-header__title">{{ title }}</h2>
    }

    @if (showRightAction) {
      <button type="button" class="right-action" (click)="rightAction.emit()">
        {{ rightActionLabel }}
      </button>
    }
  </div>

  @if (tabs.length) {
    <div
      class="page-header__tabs"
      role="tablist"
      [style.--tab-count]="tabs.length"
      [style.--selected-tab-index]="selectedTabIndex"
    >
      @for (tab of tabs; track tabLabel(tab)) {
        <button
          type="button"
          role="tab"
          class="page-header__tab"
          [class.page-header__tab--selected]="isTabSelected(tabLabel(tab))"
          [attr.aria-selected]="isTabSelected(tabLabel(tab))"
          (click)="selectTab(tabLabel(tab))"
        >
          {{ tabLabel(tab) }}
          @if (tabCount(tab) !== undefined) {
            <span class="page-header__tab-count" aria-hidden="true">
              {{ tabCount(tab) }}
            </span>
          }
        </button>
      }
    </div>
  }
}
