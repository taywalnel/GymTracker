<app-page-header
  title="Add Exercise"
  [showBack]="true"
  (back)="goBack()"
></app-page-header>

<form class="exercise-form" (ngSubmit)="save()">
  <div class="form-group">
    <label for="exerciseTitle" class="form-label">Title</label>
    <input
      id="exerciseTitle"
      type="text"
      class="form-input"
      [(ngModel)]="title"
      name="title"
      required
      placeholder="e.g., Bench Press"
      [attr.aria-invalid]="validationAttempted && !title.trim()"
      aria-describedby="titleError"
    />
    @if (validationAttempted && !title.trim()) {
      <p class="form-error" id="titleError">Enter an exercise title.</p>
    }
  </div>
  <div class="form-group">
    <label for="exerciseWeight" class="form-label">Weight</label>
    <div class="weight-input-row">
      <input
        id="exerciseWeight"
        type="number"
        class="form-input"
        [(ngModel)]="weight"
        name="weight"
        min="0"
        step="0.1"
        inputmode="decimal"
        required
        [attr.aria-invalid]="validationAttempted && weightKg === null"
        aria-describedby="weightError"
      />
      <app-unit-toggle />
    </div>
    @if (validationAttempted && weightKg === null) {
      <p class="form-error" id="weightError">Enter a weight amount.</p>
    }
  </div>
  <div class="row">
    <div class="form-group stepper-container">
      <p class="form-label" id="setsLabel">Sets</p>
      <app-stepper
        [value]="sets"
        [minimum]="1"
        unit="sets"
        ariaLabel="sets"
        aria-labelledby="setsLabel"
        (valueChange)="sets = $event"
      ></app-stepper>
    </div>

    <div class="form-group stepper-container">
      <p class="form-label" id="repsLabel">Reps</p>
      <app-stepper
        [value]="reps"
        [minimum]="1"
        unit="reps"
        ariaLabel="reps"
        aria-labelledby="repsLabel"
        (valueChange)="reps = $event"
      ></app-stepper>
    </div>
  </div>

  <div class="form-actions">
    <app-button variant="secondary" [fullWidth]="true" (click)="goBack()">
      Cancel
    </app-button>
    <app-button type="submit" variant="primary" [fullWidth]="true">
      Add Exercise
    </app-button>
  </div>
</form>
