<app-page-header
  [title]="pageTitle"
  [showBack]="true"
  (back)="goBack()"
></app-page-header>

@if (isLoadingExercises) {
  <div class="loading-state" role="status" aria-label="Loading exercises">
    <app-loading-spinner></app-loading-spinner>
  </div>
} @else {
  <div class="content-container">
    <div class="card edit-body">
      <h2>{{ existingExercise?.name }}</h2>

      <app-set-targets
        [targets]="targets"
        (targetsChange)="targets = $event"
      />
      <div class="recovery-container">
        <p class="form-label">Recovery time</p>
        <app-stepper
          [value]="restSeconds"
          [minimum]="0"
          unit="seconds"
          ariaLabel="rest between sets in seconds"
          (valueChange)="restSeconds = $event"
        ></app-stepper>
      </div>
    </div>
    <div class="form-actions">
      <app-button
        type="button"
        variant="primary"
        [fullWidth]="true"
        (click)="save()"
        >Save</app-button
      >
    </div>
  </div>
}
