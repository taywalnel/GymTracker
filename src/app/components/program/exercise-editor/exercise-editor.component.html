<app-page-header
  [title]="isEditing ? 'Edit Exercise' : 'New Exercise'"
  [showBack]="true"
  (back)="cancel()"
></app-page-header>

<form class="exercise-form" (ngSubmit)="save()">
  <app-input
    id="exerciseName"
    label="Exercise Name"
    [(ngModel)]="name"
    name="exerciseName"
    placeholder="e.g., Barbell Row"
    [required]="true"
    [invalid]="validationAttempted && !name.trim()"
    [error]="
      validationAttempted && !name.trim() ? 'Enter an exercise name.' : null
    "
  ></app-input>

  <app-select
    id="primaryMuscleGroup"
    label="Primary muscle group"
    [(ngModel)]="primaryMuscleGroup"
    name="primaryMuscleGroup"
    [options]="muscleGroupOptions"
    placeholder="Uncategorized"
  ></app-select>

  <app-checkbox-list
    id="secondaryMuscleGroups"
    label="Secondary muscle groups"
    [(ngModel)]="secondaryMuscleGroups"
    name="secondaryMuscleGroups"
    [options]="muscleGroupOptions"
    [disabledOptions]="primaryMuscleGroup ? [primaryMuscleGroup] : []"
  ></app-checkbox-list>

  <div class="form-actions">
    <app-button
      variant="secondary"
      [fullWidth]="true"
      [disabled]="saving"
      type="button"
      (click)="cancel()"
    >
      Cancel
    </app-button>
    <app-button
      variant="primary"
      [fullWidth]="true"
      [disabled]="saving"
      type="submit"
    >
      {{ saving ? "Saving..." : isEditing ? "Save changes" : "Save" }}
    </app-button>
  </div>
</form>
