<app-page-header
  [title]="isEditing ? 'Edit Exercise' : 'New Exercise'"
  [showBack]="true"
  (back)="cancel()"
></app-page-header>

<form class="exercise-form" (ngSubmit)="save()">
  <app-input
    id="exerciseName"
    label="Exercise Name"
    [(ngModel)]="name"
    name="exerciseName"
    placeholder="e.g., Barbell Row"
    [required]="true"
  ></app-input>

  <app-choice-list
    label="Muscle Group"
    [options]="muscleGroupOptions"
    [(value)]="primaryMuscleGroup"
    [fill]="true"
  ></app-choice-list>

  <div class="form-actions">
    <app-button
      variant="secondary"
      [fullWidth]="true"
      [disabled]="saving"
      type="button"
      (click)="cancel()"
    >
      Cancel
    </app-button>
    <app-button
      variant="primary"
      [fullWidth]="true"
      [disabled]="!canSave"
      [loading]="saving"
      type="submit"
    >
      {{ isEditing ? "Save changes" : "Save" }}
    </app-button>
  </div>
</form>
