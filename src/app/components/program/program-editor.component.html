<app-page-header
  [title]="routineId ? 'Edit Routine' : 'New Routine'"
  backLink="/program"
></app-page-header>

@if (loading) {
  <div class="state-message">Loading…</div>
}

@if (!loading) {
  <form class="routine-form" (ngSubmit)="save()" novalidate>
    <div class="form-group">
      <label for="routineName" class="form-label">Routine Name</label>
      <input
        id="routineName"
        type="text"
        class="form-input"
        [class.form-input--invalid]="validationErrors.name"
        [(ngModel)]="routine.name"
        (ngModelChange)="clearNameError()"
        name="routineName"
        placeholder="e.g., Chest / Triceps"
        [attr.aria-invalid]="validationErrors.name"
        aria-describedby="routineNameError"
      />
      @if (validationErrors.name) {
        <p id="routineNameError" class="form-error" role="alert">
          Enter a routine name.
        </p>
      }
    </div>
    <label class="form-label">Exercises</label>
    <div class="exercise-list">
      @for (ex of routine.exercises; track ex.id) {
        <app-editable-card
          [title]="ex.name"
          [description]="exerciseDescription(ex)"
          (edit)="editExercise(ex)"
          (delete)="deleteExercise(ex)"
        ></app-editable-card>
      }
    </div>
    @if (validationErrors.exercises) {
      <p class="form-error" role="alert">Add at least one exercise.</p>
    }
    <div class="form-footer">
      <app-button variant="secondary" [fullWidth]="true" (click)="addExercise()"
        >Add Exercise
      </app-button>
      <app-button
        variant="primary"
        type="submit"
        [fullWidth]="true"
        [disabled]="saving"
      >
        {{ saving ? "Saving..." : "Save Routine" }}
      </app-button>
    </div>
  </form>
}
