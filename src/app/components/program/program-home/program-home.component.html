<div class="program-home-container">
  <app-page-header
    title="Program"
    [tabs]="programTabs"
    [initialTab]="activeTab"
    [showRightAction]="activeTab === 'Routines' && routineCount > 0"
    [rightActionLabel]="editingRoutines ? 'Done' : 'Edit'"
    (rightAction)="editingRoutines = !editingRoutines"
    (selectedTab)="selectTab($event)"
  />

  <div class="page-content">
    @if (activeTab === "Routines") {
      <app-workout-list [editing]="editingRoutines" />
    } @else {
      <app-exercises-list />
    }
  </div>
</div>
