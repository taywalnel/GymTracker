<div class="program-home-container">
  <app-page-header
    title="Program"
    [tabs]="programTabs"
    [initialTab]="activeTab"
    (selectedTab)="selectTab($event)"
  />

  <div class="page-content">
    @if (activeTab === "Routines") {
      <app-workout-list />
    } @else {
      <app-exercises-list />
    }
  </div>
</div>
