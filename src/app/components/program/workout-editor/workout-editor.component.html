<app-page-header
  [title]="routineId ? 'Edit Routine' : 'New Routine'"
  [showBack]="true"
  (back)="requestBack()"
></app-page-header>

<div class="page-content">
  <app-input
    id="routineName"
    label="Routine Name"
    type="text"
    [(ngModel)]="routine.name"
    (ngModelChange)="clearNameError()"
    [name]="'routineName'"
    [placeholder]="'e.g., Chest / Triceps'"
    [invalid]="validationErrors.name"
    [error]="validationErrors.name ? 'Enter a routine name.' : null"
  ></app-input>
  <label class="form-label">Exercises</label>
  <div class="exercise-list-container">
    <div class="exercise-list">
      @for (ex of routine.exercises; track ex.id) {
        <app-editable-card
          [title]="ex.name"
          [description]="exerciseDescription(ex)"
          (edit)="editExercise(ex)"
          (delete)="deleteExercise(ex.id)"
        ></app-editable-card>
      }
    </div>
  </div>

  @if (validationErrors.exercises) {
    <p class="form-error" role="alert">Add at least one exercise.</p>
  }
  <app-button variant="secondary" [fullWidth]="true" (click)="addExercise()"
    >Add exercise
  </app-button>
  <div class="main-actions">
    <app-button
      variant="secondary"
      [fullWidth]="true"
      [disabled]="saving || !hasUnsavedChanges"
      (click)="requestBack()"
    >
      Discard
    </app-button>
    <app-button
      variant="primary"
      type="submit"
      [fullWidth]="true"
      [disabled]="saving || !hasUnsavedChanges"
      (click)="save()"
    >
      {{ saving ? "Saving..." : "Save" }}
    </app-button>
  </div>
</div>

@if (showDiscardConfirmation) {
  <app-confirmation-modal
    title="Discard changes?"
    message="Your changes will be discarded."
    confirmLabel="Discard"
    [danger]="true"
    (confirmed)="discardChanges()"
    (cancelled)="cancelDiscard()"
  />
}
