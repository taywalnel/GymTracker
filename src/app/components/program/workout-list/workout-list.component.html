@if (!loading && routines.length === 0) {
  <div class="empty-state">
    <p>No routines yet. Create your first routine to get started.</p>
  </div>
}

@if (!loading && routines.length > 0) {
  <div class="routine-list">
    <div class="routine-list-scroll">
      @for (routine of routines; track routine.id) {
        <app-card
          [title]="routine.name"
          [description]="
            routine.exercises.length +
            ' exercise' +
            (routine.exercises.length !== 1 ? 's' : '')
          "
          (click)="viewRoutine(routine)"
        ></app-card>
      }
    </div>
  </div>
}

<div class="workout-list-actions">
  <app-button
    variant="secondary"
    [fullWidth]="true"
    [height]="'40px'"
    (click)="createRoutine()"
  >
    New Routine
  </app-button>
</div>
