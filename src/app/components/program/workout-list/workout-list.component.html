<div class="workout-list-container">
  <app-page-header title="Workouts" backLink="/program" />

  @if (loading) {
    <div class="loading">Loading routines...</div>
  }

  @if (!loading && routines.length === 0) {
    <div class="empty-state">
      <p>No routines yet. Create your first routine to get started.</p>
    </div>
  }

  @if (!loading && routines.length > 0) {
    <div class="routine-list">
      @for (routine of routines; track routine.id) {
        <app-card
          [title]="routine.name"
          [description]="
            routine.exercises.length +
            ' exercise' +
            (routine.exercises.length !== 1 ? 's' : '')
          "
          [showChevron]="true"
          (click)="editRoutine(routine)"
        ></app-card>
      }
    </div>
  }

  <div class="workout-list-actions">
    <app-button
      variant="primary"
      [fullWidth]="true"
      [height]="'40px'"
      (click)="createRoutine()"
    >
      New Routine
    </app-button>
  </div>
</div>
