@if (!loading && routines.length === 0) {
  <div class="empty-state">
    <p>No routines yet. Create your first routine to get started.</p>
  </div>
}

@if (!loading && routines.length > 0) {
  <div class="routine-list">
    <div class="routine-list-scroll">
      @for (routine of routines; track routine.id) {
        <app-editable-card
          [title]="routine.name"
          [description]="
            routine.exercises.length +
            ' exercise' +
            (routine.exercises.length !== 1 ? 's' : '')
          "
          (edit)="viewRoutine(routine)"
          (delete)="deleteRoutine(routine)"
        ></app-editable-card>
      }
    </div>
  </div>
}

@if (pendingDeleteRoutine) {
  <app-confirmation-modal
    title="Delete routine?"
    [message]="
      'Delete ' + pendingDeleteRoutine.name + '? This cannot be undone.'
    "
    confirmLabel="Delete"
    [danger]="true"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
}

<div class="workout-list-actions">
  <app-button
    variant="secondary"
    [fullWidth]="true"
    [height]="'40px'"
    (click)="createRoutine()"
  >
    New Routine
  </app-button>
</div>
