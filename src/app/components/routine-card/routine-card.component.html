@if (badge) {
  <div class="routine-card__label-row">
    <span class="routine-card__badge">{{ badge }}</span>
  </div>
}

<div class="routine-card__body">
  <div class="routine-card__content">
    <span class="routine-card__name">{{ title }}</span>
    @if (description) {
      <span class="routine-card__meta">{{ description }}</span>
    }
  </div>
  <ng-content />
  @if (showChevron) {
    <span class="routine-card__chevron" aria-hidden="true">›</span>
  }
</div>
