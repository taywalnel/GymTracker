<div class="stepper">
  <button
    type="button"
    class="stepper__btn stepper__btn--minus"
    (pointerdown)="startPress(decrease.bind(this), $event)"
    (pointerup)="stopPress()"
    (pointercancel)="stopPress()"
    (click)="handleClick(decrease.bind(this))"
    [disabled]="value <= minimum"
    [attr.aria-label]="'Decrease ' + ariaLabel"
  >
    −
  </button>
  <div class="stepper__value" aria-live="polite">
    @if (editing) {
      <input
        #valueInput
        class="stepper__number"
        type="text"
        inputmode="numeric"
        pattern="-?[0-9]*"
        autocomplete="off"
        [value]="draftValue"
        [attr.aria-label]="ariaLabel"
        (input)="sanitizeDraft($event)"
        (keydown)="handleEditKeydown($event)"
        (blur)="commitDraft()"
        autofocus
      />
    } @else {
      <span class="stepper__number" (click)="startEditing()">{{ value }}</span>
    }
    @if (unit) {
      <span class="stepper__unit">{{ unit }}</span>
    }
  </div>
  <button
    type="button"
    class="stepper__btn stepper__btn--plus"
    (pointerdown)="startPress(increase.bind(this), $event)"
    (pointerup)="stopPress()"
    (pointercancel)="stopPress()"
    (click)="handleClick(increase.bind(this))"
    [attr.aria-label]="'Increase ' + ariaLabel"
  >
    +
  </button>
</div>
