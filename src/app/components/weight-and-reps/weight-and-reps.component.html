<div class="weight-and-reps-rows">
  @for (row of rows; track row.startIndex) {
    <div
      class="weight-and-reps"
      [class.weight-and-reps--small]="size === 'small'"
    >
      <div class="weight-container">
        <span class="weight-value">{{ units.formatWeight(row.weightKg) }}</span>
        <span class="weight-unit">{{ units.unitLabel() }}</span>
      </div>

      <div class="sets-container">
        @for (item of row.sets; track item.index) {
          <button
            type="button"
            [class]="getSetClass(item.set)"
            [class.set-container--selectable]="activeIndex !== null"
            [disabled]="activeIndex === null"
            [attr.aria-label]="setAriaLabel(item.set, item.index, row.weightKg)"
            (click)="setSelected.emit(item.index)"
          >
            <span>{{ item.set.achievedAmount || item.set.targetAmount }}</span>
            @if (setWeightLabel(item.set); as weightLabel) {
              <span class="set-weight">{{ weightLabel }}</span>
            }
          </button>
        }

        @if (
          activeIndex !== null &&
          activeIndex >= row.startIndex &&
          activeIndex < row.startIndex + row.sets.length
        ) {
          <div
            class="active-indicator"
            [style.transform]="
              'translate(' + (activeIndex - row.startIndex) * 44 + 'px, 8px)'
            "
          ></div>
        }
      </div>
    </div>
  }
</div>
